<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#123c3a">
<title>قائمة المنتجات | وصّال</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--green:#123c3a;--green2:#1b625b;--orange:#f49a38;--cream:#f7f8f5;--ink:#1d2927;--muted:#71807b;--line:#e5eae6;--white:#fff}
*{box-sizing:border-box}body{margin:0;background:var(--cream);font-family:Tahoma,Arial,sans-serif;color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}
.top{background:var(--green);color:white;padding:14px max(18px,calc((100% - 1120px)/2));display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:22px}.logo{width:42px;height:42px;border-radius:14px;background:var(--orange);display:grid;place-items:center;color:var(--green);font-size:24px}
.top small{display:block;color:#d6e4df;font-size:11px;font-weight:400;margin-top:3px}.top button{background:#fff;color:var(--green);padding:10px 14px;border-radius:12px;font-weight:700}
.wrap{max-width:1120px;margin:auto;padding:20px 16px 70px}
.store-header{background:#fff;border:1px solid var(--line);border-radius:20px;padding:20px;margin-bottom:24px;display:flex;align-items:center;gap:20px;box-shadow:0 4px 10px rgba(0,0,0,0.03)}
.store-img{width:100px;height:100px;border-radius:16px;object-fit:cover;background:#e8efec;display:grid;place-items:center;font-size:38px;overflow:hidden;flex-shrink:0}
.store-info h1{margin:0 0 8px;font-size:24px}.store-info p{margin:0;color:var(--muted);font-size:14px}
.products{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.product{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;min-height:205px}
.pic{height:110px;border-radius:13px;background:#f2f5f1;display:grid;place-items:center;font-size:43px;margin-bottom:12px;background-size:cover;background-position:center}
.product h3{font-size:15px;margin:0 0 5px}.product small{color:var(--muted)}
.price-row{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:14px}
.price{font-weight:800;color:var(--green2)}.add{background:var(--green);color:#fff;border-radius:10px;padding:8px 13px;font-weight:700}
.cart-fab{position:fixed;bottom:18px;left:18px;background:var(--orange);color:#173d38;border-radius:50px;padding:14px 19px;font-weight:800;box-shadow:0 8px 25px #0002;z-index:5}
.overlay{display:none;position:fixed;inset:0;background:#0008;z-index:10;align-items:flex-end;justify-content:center}.overlay.show{display:flex}
.drawer{background:white;width:min(100%,560px);max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:22px}
.drawer-head{display:flex;justify-content:space-between;align-items:center}.close{background:#edf1ed;border-radius:50%;width:34px;height:34px;font-size:19px}
.cart-line{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);gap:10px}.qty{display:flex;align-items:center;gap:6px}.qty button{background:#edf3ef;border-radius:8px;padding:5px 10px}
.store-box{background:#f4f8f6;border:1px solid #d7e5df;border-radius:12px;padding:10px 12px;margin:12px 0;font-size:12px;line-height:1.7}
.warn-box{background:#fff8eb;border:1px solid #f4cf8a;color:#7a4f01;border-radius:10px;padding:8px 10px;margin-top:6px;font-size:11px}
.summary-box{background:#f8faf9;border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:10px;font-size:13px}
.summary-row{display:flex;justify-content:space-between;margin:5px 0}
.field{display:grid;gap:6px;margin:12px 0}.field label{font-size:13px;font-weight:700}.field input,.field select,.field textarea{width:100%;border:1px solid #dce4de;border-radius:10px;padding:12px;background:#fff;outline-color:var(--green2)}
.submit{width:100%;padding:14px;background:var(--green);color:white;border-radius:12px;font-weight:800;margin-top:12px}.muted{color:var(--muted);font-size:12px;line-height:1.7}
@media(max-width:760px){.products{grid-template-columns:repeat(2,1fr)}.store-header{flex-direction:column;text-align:center}}
</style>
</head>
<body>
<header class="top">
 <div class="brand" style="cursor:pointer" onclick="window.location.href='index.html'"><div class="logo">و</div><div>وصّال دسوق<small>طلبك علينا.. لحد باب بيتك</small></div></div>
 <button onclick="openCart()">🛒 السلة <span id="topCount">0</span></button>
</header>

<main class="wrap">
 <div style="margin-bottom: 15px;">
   <button onclick="window.location.href='index.html'" style="background: none; color: var(--green2); font-weight: bold;">← العودة للمتاجر</button>
 </div>

 <section class="store-header">
  <div id="storeImgBox" class="store-img">🏪</div>
  <div class="store-info">
   <h1 id="storeName">جاري التحميل...</h1>
   <p id="storeCategory">التصنيف: ...</p>
   <p id="storeStatusBadge" style="margin-top:6px;font-weight:800;font-size:13px"></p>
  </div>
 </section>

 <div class="section-head"><h2>قائمة المنتجات</h2></div>
 <section class="products" id="productsContainer"><p class="muted">جاري تحميل المنتجات...</p></section>
</main>

<button class="cart-fab" onclick="openCart()">🛒 سلة الطلب <span id="fabCount">0</span></button>

<div class="overlay" id="overlay" onclick="if(event.target===this)closeCart()"><div class="drawer">
 <div class="drawer-head"><h2 style="margin:0">سلة مشترياتك</h2><button class="close" onclick="closeCart()">×</button></div>
 <div id="storeContextBox"></div>
 <div id="cartItems"></div>
 <div class="summary-box" id="cartSummary"></div>
 <div class="field"><label>منطقة التوصيل</label><select id="checkoutArea"><option>مدينة دسوق</option><option>شباس الشهداء</option><option>محلة أبو علي</option><option>سنّهور المدينة</option><option>أبو زيادة</option><option>قرية أخرى</option></select></div>
 <div class="field"><label>الاسم</label><input id="customerName" placeholder="الاسم بالكامل"></div>
 <div class="field"><label>رقم الهاتف</label><input id="customerPhone" type="tel" placeholder="01xxxxxxxxx"></div>
 <div class="field"><label>العنوان بالتفصيل</label><textarea id="customerAddress" rows="2" placeholder="الشارع، رقم المنزل، علامة مميزة"></textarea></div>
 <div class="field"><label>ملاحظات للطلب (اختياري)</label><textarea id="notes" rows="2" placeholder="أي تفاصيل إضافية"></textarea></div>
 <p class="muted">الدفع نقداً عند الاستلام. رسوم التوصيل يحددها فريق التشغيل بعد تأكيد المنطقة.</p>
 <button class="submit" id="btnSubmit" onclick="placeOrder()">تأكيد وإرسال الطلب</button>
</div></div>

<script>
const SUPABASE_URL = "https://ftjwvqjcjncgqonvyjdv.supabase.co";
const SUPABASE_KEY = "sb_publishable_52V8TEri0EWrESm9AKfRgw_oNtK3qUh";
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const CART_STORAGE_KEY = "wassal_cart_v1";
const urlParams = new URLSearchParams(window.location.search);
const storeId = urlParams.get('id');

const pharmacyDefaultProducts = [
  { id: "ph_gauze", name: "شاش ومعقم طبي", price: 35, unit: "للعبوة", emoji: "🩹" },
  { id: "ph_vitamins", name: "فيتامينات ومقويات عامة", price: 95, unit: "للعبوة", emoji: "💊" },
  { id: "ph_firstaid", name: "حقيبة إسعافات أولية منزلية", price: 140, unit: "للحقيبة", emoji: "🩺" },
  { id: "ph_skincare", name: "غسول ومرطب طبي للبشرة", price: 75, unit: "للعبوة", emoji: "🧴" }
];

let currentStoreName = "";
let currentStoreIsOpen = true;
let productsList = [];
const money = n => Number(n || 0).toLocaleString("ar-EG") + " ج.م";

function isStoreOpenStatus(status) {
  const s = String(status || "open").trim().toLowerCase();
  return s === "open" || s === "مفتوح" || s === "active";
}

function isPharmacyStore(store) {
  if (!store) return false;
  const combined = `${store.name || ""} ${store.category || ""}`.toLowerCase();
  return combined.includes("صيدل") || combined.includes("pharmacy");
}

function loadCart() {
  try {
    const raw = localStorage.getItem(CART_STORAGE_KEY);
    const parsed = raw ? JSON.parse(raw) : [];
    return Array.isArray(parsed) ? parsed : [];
  } catch (_) {
    return [];
  }
}

function saveCart(items) {
  try {
    localStorage.setItem(CART_STORAGE_KEY, JSON.stringify(items));
  } catch (_) {}
}

let cartItems = loadCart();

function getCartStoreInfo() {
  if (!cartItems.length) {
    return { label: "لا توجد عناصر بعد", hasMixedSources: false, storeClosed: false };
  }
  const ids = cartItems.map(i => i.store_id || null);
  const uniqueStores = [...new Set(ids.filter(Boolean))];
  const hasNull = ids.some(id => !id);
  const storeClosed = String(uniqueStores[0] || "") === String(storeId) && !currentStoreIsOpen;

  if (uniqueStores.length === 1 && !hasNull) {
    const sid = uniqueStores[0];
    const namePart = (String(sid) === String(storeId) && currentStoreName)
      ? `${currentStoreName}`
      : `متجر (${sid})`;
    return { label: `متجر: ${namePart}`, hasMixedSources: false, storeClosed };
  }
  if (uniqueStores.length === 0 && hasNull) {
    return { label: "منتجات مقترحة (طلب عام)", hasMixedSources: false, storeClosed: false };
  }
  return {
    label: "عناصر من أكثر من مصدر أو متجر",
    hasMixedSources: true,
    storeClosed
  };
}

async function loadStoreData() {
  if (!storeId) {
    alert("لم يتم تحديد متجر!");
    window.location.href = "index.html";
    return;
  }

  const { data: store, error: storeErr } = await supabaseClient
    .from('stores')
    .select('*')
    .eq('id', storeId)
    .single();

  if (storeErr || !store) {
    console.error(storeErr);
    document.getElementById('storeName').textContent = "تعذر العثور على المتجر";
    return;
  }

  currentStoreName = store.name || "";
  currentStoreIsOpen = isStoreOpenStatus(store.status);

  document.getElementById('storeName').textContent = store.name;
  document.getElementById('storeCategory').textContent = "التصنيف: " + (store.category || 'عام');

  const statusBadge = document.getElementById('storeStatusBadge');
  if (statusBadge) {
    statusBadge.textContent = currentStoreIsOpen ? "مفتوح 🟢" : "مغلق 🔴";
    statusBadge.style.color = currentStoreIsOpen ? "#137333" : "#c5221f";
  }

  const imgBox = document.getElementById('storeImgBox');
  if (store.image_url) {
    imgBox.innerHTML = `<img src="${store.image_url}" alt="${store.name}" style="width:100%;height:100%;object-fit:cover;border-radius:16px">`;
  }

  updateCart();

  const { data: products, error: prodErr } = await supabaseClient
    .from('products')
    .select('*')
    .eq('store_id', storeId);

  const container = document.getElementById('productsContainer');

  if (!prodErr && Array.isArray(products) && products.length > 0) {
    productsList = products;
    container.innerHTML = products.map(p => `
      <article class="product">
        <div class="pic" style="background-image: url('${p.image_url || ''}')">
          ${!p.image_url ? '📦' : ''}
        </div>
        <h3>${p.name}</h3>
        <small>${p.unit || 'للقطعة'}</small>
        <div class="price-row">
          <span class="price">${money(p.price)}</span>
          <button class="add" onclick="addStoreProduct('${p.id}')">+ أضف</button>
        </div>
      </article>
    `).join("");
    return;
  }

  if (isPharmacyStore(store)) {
    productsList = pharmacyDefaultProducts;
    container.innerHTML = pharmacyDefaultProducts.map(p => `
      <article class="product">
        <div class="pic">${p.emoji}</div>
        <h3>${p.name}</h3>
        <small>${p.unit} — ${store.name}</small>
        <div class="price-row">
          <span class="price">${money(p.price)}</span>
          <button class="add" onclick="addStoreProduct('${p.id}')">+ أضف</button>
        </div>
      </article>
    `).join("");
    return;
  }

  container.innerHTML = '<p class="muted">لا توجد منتجات مضافة في هذا المتجر حالياً.</p>';
}

function addStoreProduct(id){
  const p = productsList.find(x => String(x.id) === String(id));
  if (!p) return;
  const key = `prod_${p.id}`;
  const existing = cartItems.find(x => x.key === key);
  if (existing) {
    existing.qty += 1;
  } else {
    cartItems.push({
      key,
      id: p.id,
      name: p.name,
      price: Number(p.price),
      unit: p.unit || 'للقطعة',
      qty: 1,
      store_id: storeId || p.store_id || null
    });
  }
  saveCart(cartItems);
  updateCart();
}

function changeItemQty(key, delta){
  const idx = cartItems.findIndex(x => x.key === key);
  if (idx === -1) return;
  cartItems[idx].qty += delta;
  if (cartItems[idx].qty <= 0) {
    cartItems.splice(idx, 1);
  }
  saveCart(cartItems);
  updateCart();
}

function totalCount(){
  return cartItems.reduce((sum, item) => sum + Number(item.qty || 0), 0);
}

function updateCart(){
  const count = totalCount();
  document.getElementById("topCount").textContent = count;
  document.getElementById("fabCount").textContent = count;

  const storeInfo = getCartStoreInfo();
  const contextBox = document.getElementById("storeContextBox");
  const summaryBox = document.getElementById("cartSummary");

  if (!cartItems.length) {
    contextBox.innerHTML = "";
    document.getElementById("cartItems").innerHTML = '<p class="muted">السلة فارغة.</p>';
    summaryBox.innerHTML = `
      <div class="summary-row"><span>عدد القطع</span><b>0</b></div>
      <div class="summary-row"><span>إجمالي الطلب</span><b>${money(0)}</b></div>
    `;
    return;
  }

  contextBox.innerHTML = `
    <div class="store-box">
      <b>جهة الطلب:</b> ${storeInfo.label}
      ${storeInfo.storeClosed ? `<div class="warn-box">تنبيه: هذا المتجر مغلق حالياً؛ لا يمكن إرسال الطلب أثناء إغلاق المتجر.</div>` : ""}
      ${storeInfo.hasMixedSources ? `<div class="warn-box">تنبيه: السلة تجمع عناصر من مصادر أو متاجر متعددة؛ يُفضّل إرسال كل طلب من متجر واحد لتسهيل التجهيز والتوصيل.</div>` : ""}
    </div>
  `;

  const rows = cartItems.map(item => `
    <div class="cart-line">
      <div>
        <b>${item.name}</b>
        <div class="muted">${money(item.price)} × ${item.qty} (${item.unit || 'للقطعة'})</div>
      </div>
      <div class="qty">
        <button onclick="changeItemQty('${item.key}', -1)">−</button>
        <b>${item.qty}</b>
        <button onclick="changeItemQty('${item.key}', 1)">+</button>
      </div>
    </div>
  `).join("");

  document.getElementById("cartItems").innerHTML = rows;
  const total = cartItems.reduce((sum, item) => sum + Number(item.price) * Number(item.qty), 0);

  summaryBox.innerHTML = `
    <div class="summary-row"><span>عدد القطع</span><b>${count}</b></div>
    <div class="summary-row"><span>مجموع المنتجات</span><b>${money(total)}</b></div>
    <div class="summary-row"><span>التوصيل</span><span class="muted">يُحدّد حسب المنطقة</span></div>
    <div class="summary-row" style="border-top:1px solid var(--line);padding-top:7px;margin-top:7px"><span>الإجمالي المبدئي</span><b style="color:var(--green2)">${money(total)}</b></div>
  `;
}

function openCart(){document.getElementById("overlay").classList.add("show");updateCart()}
function closeCart(){document.getElementById("overlay").classList.remove("show")}

async function placeOrder(){
 if(!totalCount()){alert("أضف منتجاً أولاً.");return}
 if(String(storeId || "") && !currentStoreIsOpen){alert("هذا المتجر مغلق حالياً ولا يمكن إرسال الطلب إليه.");return}
 const name = document.getElementById("customerName").value.trim();
 const phone = document.getElementById("customerPhone").value.trim();
 const address = document.getElementById("customerAddress").value.trim();
 if(!name || !phone || !address){alert("يرجى إكمال البيانات.");return}

 const submitBtn = document.getElementById("btnSubmit");
 submitBtn.disabled = true;

 const orderNum = "WD-" + Date.now().toString().slice(-6);
 const totalAmount = cartItems.reduce((sum, item) => sum + Number(item.price) * Number(item.qty), 0);
 const resolvedStoreId = storeId || cartItems.find(item => item.store_id)?.store_id || null;

 try {
   const orderPayload = {
     order_number: orderNum,
     customer_name: name,
     customer_phone: phone,
     delivery_area: document.getElementById("checkoutArea").value,
     delivery_address: address,
     notes: document.getElementById("notes").value || '',
     subtotal: totalAmount,
     delivery_fee: 0,
     total: totalAmount,
     status: 'new'
   };
   if (resolvedStoreId) orderPayload.store_id = resolvedStoreId;

   const { data: orderData, error: orderErr } = await supabaseClient
     .from('orders')
     .insert([orderPayload])
     .select();

   if (orderErr) throw orderErr;

   const orderItemsData = cartItems.map(item => ({
     order_id: orderData[0].id,
     item_name: item.name,
     quantity: item.qty,
     unit_price: item.price,
     total_price: item.qty * item.price
   }));

   const { error: itemsErr } = await supabaseClient.from('order_items').insert(orderItemsData);
   if (itemsErr) throw itemsErr;

   alert("✅ تم إرسال طلبك بنجاح! رقم الطلب: " + orderNum);
   cartItems = [];
   saveCart(cartItems);
   updateCart();
   closeCart();
 } catch(err) {
   alert("خطأ: " + err.message);
 } finally {
   submitBtn.disabled = false;
 }
}

document.addEventListener('DOMContentLoaded', () => {
  updateCart();
  loadStoreData();
});
</script>
</body>
</html>
